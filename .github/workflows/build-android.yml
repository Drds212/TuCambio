name: Compilar APK Android (TuCambio)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android sin cuenta Expo
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar proyecto nativo Android con Expo Prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Asignar permisos de ejecución a gradlew
        run: chmod +x ./android/gradlew

      - name: Compilar APK Android (Debug) con Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir APK generado como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: TuCambio-v1.0.0-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
